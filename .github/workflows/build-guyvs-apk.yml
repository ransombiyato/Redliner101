name: Build GuyVs Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "guyvs-android/**"
      - ".github/workflows/build-guyvs-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guyvs-android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: guyvs-android/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Report runner capacity
        run: |
          free -h
          df -h .

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew build --no-daemon --max-workers=2 --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guyvs-debug-apk
          path: guyvs-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
